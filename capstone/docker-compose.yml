name: capstone

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: drone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone -d drone"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://drone:secret@postgres:5432/drone
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://drone:secret@postgres:5432/drone
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    # образ backend має HEALTHCHECK на HTTP-порт, якого у воркера немає
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "14550:14550/udp"
    environment:
      BACKEND_URL: http://backend:8000
      MAVLINK_SOURCE: udp:0.0.0.0:14550
      HEARTBEAT_TIMEOUT: "120"
    depends_on:
      backend:
        condition: service_healthy

  sim:
    build: ./sim
    command: python mavlink_sim.py --target udpout:gateway:14550 --rate 5
    depends_on:
      - gateway
    profiles: ["sim"]

  sitl:
    image: radarku/ardupilot-sitl:eff32c1f98152ac3d1dc09a1e475733b73ce569f
    environment:
      VEHICLE: ArduCopter
      MODEL: "+"
      SPEEDUP: "1"
      SITL_UDP_OUTPUT_ADDRESS: udp:gateway:14550
    depends_on:
      - gateway
    # MAVProxy всередині образу завершується без TTY/stdin
    stdin_open: true
    tty: true
    profiles: ["sitl"]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
